<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Concentrador de Reportes · Agencia Chalco</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#ffffff;color:#1f2937}
header{padding:15px 20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;color:#0369a1;font-size:20px}
.subtitle{color:#6b7280;font-size:13px;margin-top:3px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;padding:9px 16px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .1s}
.btn:hover:not(:disabled){opacity:.88}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:#0284c7;color:#ffffff}
.btn-secondary{background:#ffffff;border:1px solid #d1d5db;color:#374151}
.btn-danger{background:#ffffff;border:1px solid #fecaca;color:#dc2626}
.filtros{padding:10px 20px;background:#f8fafc;border-bottom:1px solid #e5e7eb;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.campo{display:flex;flex-direction:column;gap:3px}
.campo label{font-size:10px;text-transform:uppercase;color:#6b7280;letter-spacing:.04em}
select,input[type=date]{background:#ffffff;border:1px solid #d1d5db;color:#1f2937;border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit}
select:focus,input:focus{outline:none;border-color:#0284c7;box-shadow:0 0 0 3px rgba(2,132,199,.12)}
main{padding:15px;max-width:1020px;margin:auto}
.card{background:#ffffff;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.card-title{color:#111827;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.card-tag{color:#0284c7;font-size:11px;text-transform:uppercase;margin-top:2px}
.card-destacada{border-color:#bae6fd;background:#f0f9ff}

.dropzone{border:2px dashed #cbd5e1;border-radius:10px;padding:24px 16px;text-align:center;color:#6b7280;font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.dropzone:hover,.dropzone.activo{border-color:#0284c7;background:#f0f9ff}
.dropzone strong{color:#0369a1;display:block;font-size:15px;margin-bottom:4px}

.vacio{text-align:center;color:#6b7280;padding:26px 15px;font-size:14px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.asesor-card{background:#f8fafc;border:1px solid #e5e7eb;border-radius:9px;padding:12px}
.asesor-head{display:flex;justify-content:space-between;align-items:baseline}
.badge{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:bold;white-space:nowrap}
.badge-osvaldo{background:#dcfce7;color:#15803d}
.badge-kevin{background:#e0e7ff;color:#4338ca}
.pct-grande{font-size:26px;font-weight:bold;line-height:1}
.det{color:#6b7280;font-size:11px;margin-top:3px;line-height:1.5}
.barra{height:8px;background:#e5e7eb;border-radius:5px;margin-top:8px;overflow:hidden}
.barra-fill{height:100%;border-radius:5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.kpi{background:#ffffff;border:1px solid #e5e7eb;border-radius:7px;padding:7px 4px;text-align:center}
.kpi-v{font-size:17px;font-weight:bold;color:#0369a1}
.kpi-l{font-size:9px;color:#6b7280;text-transform:uppercase;margin-top:2px;line-height:1.2}

/* Comparativa */
.comp-fila{display:flex;align-items:center;gap:10px;margin-top:10px}
.comp-nom{width:88px;flex-shrink:0;font-size:13px;font-weight:bold}
.comp-track{flex:1;height:26px;background:#f1f5f9;border-radius:6px;overflow:hidden;position:relative}
.comp-fill{height:100%;border-radius:6px;transition:width .3s ease}
.comp-val{width:52px;flex-shrink:0;text-align:right;font-size:15px;font-weight:bold}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:#6b7280}
.leyenda span i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chart-scroll{overflow-x:auto;margin-top:12px}

/* Pendientes */
.pend-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.pend-card{background:#ffffff;border:1px solid #e5e7eb;border-radius:9px;padding:12px}
.pend-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pend-grupo{font-size:10px;text-transform:uppercase;color:#0284c7;letter-spacing:.04em;font-weight:bold;margin-top:9px}
.pend-lista{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.6}
.pend-lista li.critica{font-weight:bold;color:#b91c1c}
.pend-ok{color:#15803d;font-size:13px;font-weight:bold}
.btn-copiar{padding:5px 12px;font-size:11px;border-radius:14px}

table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{border-bottom:1px solid #f1f5f9;padding:7px 6px}
th{color:#6b7280;text-transform:uppercase;font-size:10px;text-align:left;font-weight:600;border-bottom:1px solid #e5e7eb}
.text-right{text-align:right}
.text-center{text-align:center}
.table-scroll{overflow-x:auto}
.table-scroll table{min-width:560px}
.nowrap{white-space:nowrap}
.alerta{color:#dc2626}
.tibio{color:#c2410c}
.ok{color:#15803d}
.gris{color:#6b7280}
.fila-falta{background:#fef2f2}
.small{font-size:12px;color:#6b7280;margin-top:8px;line-height:1.5}
.pill{display:inline-block;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:2px 9px;font-size:11px;color:#374151;margin:3px 3px 0 0}
.pill-x{cursor:pointer;color:#dc2626;margin-left:5px;font-weight:bold}

/* Descansos */
.desc-fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid #f1f5f9}
.desc-fila:last-child{border-bottom:none}
.dias-semana{display:flex;gap:4px}
.dia-btn{width:32px;height:30px;border-radius:7px;border:1px solid #d1d5db;background:#ffffff;color:#6b7280;font-size:12px;cursor:pointer;font-family:inherit;padding:0}
.dia-btn.activo{background:#e0f2fe;border-color:#0284c7;color:#0369a1;font-weight:bold}
.desc-fechas{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.oculto{display:none}
@media(max-width:640px){.grid2,.pend-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body>

<header>
<div>
<h1>CONCENTRADOR DE REPORTES · AGENCIA CHALCO</h1>
<div class="subtitle" id="subtitulo">Sin reportes cargados</div>
</div>
<div class="header-actions">
<button class="btn btn-primary" id="btn-cargar">Cargar reportes</button>
<button class="btn btn-secondary" id="btn-exportar" disabled>Exportar consolidado</button>
<button class="btn btn-danger" id="btn-borrar" disabled>Borrar todo</button>
</div>
</header>

<div class="filtros">
<div class="campo"><label for="f-desde">Desde</label><input type="date" id="f-desde"></div>
<div class="campo"><label for="f-hasta">Hasta</label><input type="date" id="f-hasta"></div>
<div class="campo"><label for="f-asesor">Asesor</label>
<select id="f-asesor"><option value="">Todos</option><option value="OSVALDO">Osvaldo</option><option value="KEVIN">Kevin</option></select></div>

<input type="file" id="input-csv" accept=".csv,text/csv" multiple style="display:none">

<main>

<div class="card">
<div class="dropzone" id="dropzone">
<strong>Arrastra aquí los reportes</strong>
Un archivo .csv por asesor y por día · puedes soltar varios a la vez
</div>
<div class="small" id="estado-carga"></div>
</div>

<div id="contenido"></div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div><div class="card-title">Días de descanso</div>
<div class="card-tag">Estos días no cuentan como reporte faltante</div></div>
<button class="btn btn-secondary" id="btn-toggle-desc" style="padding:6px 12px;font-size:12px">Mostrar</button>
</div>
<div id="panel-descansos" class="oculto"></div>
</div>

</main>

<textarea id="clip-helper" style="position:fixed;left:-9999px;top:0"></textarea>

<script>
/* =========================================================
   Catálogo. Debe coincidir con las claves del checklist.
   bloque: "parte1" o "parte2" · p: peso · na: admite No aplica
   ========================================================= */
const BLOQUES=[
{id:"parte1",titulo:"Primera parte del turno"},
{id:"parte2",titulo:"Segunda parte del turno"}
];
const ACTIVIDADES={
limpieza_agencia:{t:"Limpieza de la agencia",p:1,b:"parte1"},
exhibicion_motos:{t:"Exhibición, acomodo y limpieza de motocicletas",p:1,b:"parte1"},
semaforos_actualizados:{t:"Semáforos actualizados",p:1,b:"parte1"},
kiosko_encendido:{t:"Kiosko digital encendido",p:1,b:"parte1"},
demos_listas:{t:"Unidades demo listas",p:1,b:"parte1"},
acomodo_refaccionaria:{t:"Refaccionaria acomodada y limpia",p:1,b:"parte1"},
redes_sociales:{t:"Gestión de redes sociales y WhatsApp",p:2,b:"parte2"},
cambaceo_realizado:{t:"Se realizó cambaceo",p:2,b:"parte2"},
comida_checada:{t:"Se envió evidencia del horario de comida checado",p:1,b:"parte2"},
hojas_membretadas:{t:"Captura de hojas membretadas al día",p:1,b:"parte2"},
mystery_shopper:{t:"Envío de role play Mystery Shopper",p:2,b:"parte2",dias:"LV"},
expedientes_netsuite:{t:"Expedientes y comprobantes en NetSuite",p:2,b:"parte2",na:true}
};
const NUMEROS={
pilot_subidos:"PILOT",
visitas_bitacora:"Visitas bitácora",
fin_ventocredit:"VentoCredit"
};
const ASESORES=["OSVALDO","KEVIN"];
const COLOR_ASESOR={OSVALDO:"#16a34a",KEVIN:"#4f46e5"};
const STORE_KEY="concentradorChalcoV3";
const STORE_VIEJO="concentradorChalcoV2";
const $=id=>document.getElementById(id);
let REPORTES={},PROSPECTOS={},DESCANSOS={fijos:{OSVALDO:[],KEVIN:[]},fechas:[]};

/* ---------- Utilidades ---------- */
function hoyISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fechaDe(iso){const p=(iso||"").split("-");return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null;}
function isoDe(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
const DIAS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
function diaSemana(iso){const d=fechaDe(iso);return d?d.getDay():0;}
function fechaCorta(iso){const d=fechaDe(iso);return d?`${DIAS[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`:iso;}
function colorPorPct(v){const p=Math.round(v);if(p>=90)return "#15803d";if(p>=80)return "#a16207";if(p>=70)return "#c2410c";return "#dc2626";}
function nombreAsesor(a){return a==="OSVALDO"?"Osvaldo":a==="KEVIN"?"Kevin":a;}
function claseBadge(a){return a==="OSVALDO"?"badge-osvaldo":a==="KEVIN"?"badge-kevin":"";}
function esc(s){return String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function diasEntre(iso){const d=fechaDe(iso),h=fechaDe(hoyISO());return (d&&h)?Math.round((h-d)/86400000):0;}

/* ---------- Parser CSV que respeta comillas ---------- */
function parseCSV(texto){
const t=String(texto).replace(/^﻿/,"");
const filas=[];let campo="",fila=[],dentro=false;
for(let i=0;i<t.length;i++){
const c=t[i];
if(dentro){
if(c==='"'){if(t[i+1]==='"'){campo+='"';i++;}else dentro=false;}
else campo+=c;
}else{
if(c==='"')dentro=true;
else if(c===","){fila.push(campo);campo="";}
else if(c==="\n"){fila.push(campo);filas.push(fila);fila=[];campo="";}
else if(c==="\r"){}
else campo+=c;
}
}
if(campo!==""||fila.length){fila.push(campo);filas.push(fila);}
return filas.filter(f=>f.some(x=>String(x).trim()!==""));
}

/* ---------- Almacenamiento ---------- */
function cargarStore(){
try{
const o=JSON.parse(localStorage.getItem(STORE_KEY));
if(o&&typeof o==="object"){
REPORTES=o.reportes||{};PROSPECTOS=o.prospectos||{};
if(o.descansos)DESCANSOS=o.descansos;
return;
}
}catch(e){}
// Primera vez con el formato nuevo: rescata solo los días de descanso de la versión anterior
try{
const v=JSON.parse(localStorage.getItem(STORE_VIEJO));
if(v&&v.descansos)DESCANSOS=v.descansos;
}catch(e){}
}
function guardarStore(){
try{localStorage.setItem(STORE_KEY,JSON.stringify({reportes:REPORTES,prospectos:PROSPECTOS,descansos:DESCANSOS}));}
catch(e){console.error("No se pudo guardar:",e);}
}

/* ---------- Importación ---------- */
function importarTexto(texto,nombreArchivo){
const filas=parseCSV(texto);
if(!filas.length)return {ok:false,msg:`${nombreArchivo}: archivo vacío`};
const enc=filas[0].map(x=>x.trim().toLowerCase());
const col=n=>enc.indexOf(n);

// Archivo de prospectos suelto (formato anterior). Se sigue aceptando.
if(col("nombre")>=0&&col("telefono")>=0){
const iF=col("fecha"),iA=col("asesor"),iN=col("nombre"),iT=col("telefono"),iM=col("modelo"),iP=col("forma_pago");
if(iF<0||iA<0)return {ok:false,msg:`${nombreArchivo}: al archivo de prospectos le falta fecha o asesor`};
const nuevos={};
filas.slice(1).forEach(f=>{
const fecha=(f[iF]||"").trim(),asesor=(f[iA]||"").trim().toUpperCase();
if(!fecha||!asesor)return;
(nuevos[fecha+"|"+asesor]=nuevos[fecha+"|"+asesor]||[]).push({
nombre:(f[iN]||"").trim(),tel:(f[iT]||"").trim(),
modelo:(iM>=0?(f[iM]||""):"").trim(),forma:(iP>=0?(f[iP]||""):"").trim()
});
});
const claves=Object.keys(nuevos);
if(!claves.length)return {ok:false,msg:`${nombreArchivo}: sin prospectos válidos`};
let n=0;claves.forEach(k=>{PROSPECTOS[k]=nuevos[k];n+=nuevos[k].length;});
return {ok:true,msg:`${nombreArchivo}: ${n} prospecto(s) de ${claves.length} día(s)`};
}

// Reporte del checklist. Desde la versión 5 trae también los prospectos.
if(col("tipo")<0||col("fecha")<0||col("asesor")<0||col("clave")<0)
return {ok:false,msg:`${nombreArchivo}: no tiene el formato de reporte del checklist`};
const iT=col("tipo"),iF=col("fecha"),iA=col("asesor"),iC=col("clave"),
i1=col("valor1"),i2=col("valor2"),i3=col("valor3");
const nuevos={},prospNuevos={};
let desconocidas=0;
filas.slice(1).forEach(f=>{
const tipo=(f[iT]||"").trim().toLowerCase(),fecha=(f[iF]||"").trim(),asesor=(f[iA]||"").trim().toUpperCase();
const clave=(f[iC]||"").trim(),
v1=(i1>=0?(f[i1]||""):"").trim(),
v2=(i2>=0?(f[i2]||""):"").trim(),
v3=(i3>=0?(f[i3]||""):"").trim();
if(!fecha||!asesor)return;
const k=fecha+"|"+asesor;
if(tipo==="prospecto"){
(prospNuevos[k]=prospNuevos[k]||[]).push({nombre:clave,tel:v1,modelo:v2,forma:v3});
return;
}
if(!nuevos[k])nuevos[k]={fecha,asesor,tipoDia:"habil",version:"",operativa:{},na:{},numeros:{}};
const r=nuevos[k];
if(tipo==="meta"){
if(clave==="version"){r.version=v1;r.tipoDia=v2||"habil";}
}
else if(tipo==="operativa"){
if(!ACTIVIDADES[clave])desconocidas++;
if(v1==="NA")r.na[clave]=true;
else r.operativa[clave]=v1==="1";
}
else if(tipo==="numero")r.numeros[clave]=parseInt(v1,10)||0;
});
const claves=Object.keys(nuevos);
if(!claves.length)return {ok:false,msg:`${nombreArchivo}: sin filas válidas`};
let reemplazados=0;
claves.forEach(k=>{if(REPORTES[k])reemplazados++;REPORTES[k]=nuevos[k];});
// El reporte manda: si el archivo trae prospectos, sustituyen a los que hubiera de ese día
Object.keys(prospNuevos).forEach(k=>{PROSPECTOS[k]=prospNuevos[k];});
const nProsp=Object.values(prospNuevos).reduce((a,v)=>a+v.length,0);
let msg=`${nombreArchivo}: ${claves.length} día(s)`;
if(nProsp)msg+=` · ${nProsp} prospecto(s)`;
if(reemplazados)msg+=` · ${reemplazados} reemplazado(s)`;
if(desconocidas)msg+=` · ⚠ ${desconocidas} actividad(es) que este concentrador no reconoce, revisa que el checklist esté actualizado`;
return {ok:true,msg};
}

function procesarArchivos(fileList){
const archivos=Array.from(fileList||[]);
if(!archivos.length)return;
let pendientes=archivos.length;const mensajes=[];
archivos.forEach(file=>{
const reader=new FileReader();
reader.onload=e=>{
try{const res=importarTexto(String(e.target.result),file.name);mensajes.push(res.msg);}
catch(err){mensajes.push(`${file.name}: error al leer (${err.message})`);}
if(--pendientes===0)terminarCarga(mensajes);
};
reader.onerror=()=>{mensajes.push(`${file.name}: no se pudo leer`);if(--pendientes===0)terminarCarga(mensajes);};
reader.readAsText(file,"UTF-8");
});
}
function terminarCarga(mensajes){
guardarStore();
$("estado-carga").innerHTML=mensajes.map(m=>`<div>${esc(m)}</div>`).join("");
ajustarFiltrosSiVacio();
render();
}

/* ---------- Descansos ---------- */
function esDescanso(iso,asesor){
if((DESCANSOS.fijos[asesor]||[]).indexOf(diaSemana(iso))>=0)return true;
return DESCANSOS.fechas.some(f=>f.fecha===iso&&f.asesor===asesor);
}
function pintarDescansos(){
let html="";
ASESORES.forEach(a=>{
const fijos=DESCANSOS.fijos[a]||[];
const fechas=DESCANSOS.fechas.filter(f=>f.asesor===a).sort((x,y)=>x.fecha<y.fecha?-1:1);
html+=`<div class="desc-fila">
<span class="badge ${claseBadge(a)}">${nombreAsesor(a)}</span>
<span class="dias-semana">${DIAS.map((d,i)=>
`<button type="button" class="dia-btn${fijos.indexOf(i)>=0?" activo":""}" data-asesor="${a}" data-dia="${i}">${d[0]}${i===0||i===3?d[1]:""}</button>`).join("")}</span>
<span class="desc-fechas">
<input type="date" class="desc-fecha-input" data-asesor="${a}">
<button type="button" class="btn btn-secondary desc-add" data-asesor="${a}" style="padding:6px 12px;font-size:12px">Agregar fecha</button>
</span>
<span style="flex-basis:100%">${fechas.length
?fechas.map(f=>`<span class="pill">${fechaCorta(f.fecha)}<span class="pill-x" data-quitar="${f.fecha}" data-asesor="${a}">×</span></span>`).join("")
:`<span class="small" style="margin:0">Sin fechas sueltas de descanso</span>`}</span>
</div>`;
});
$("panel-descansos").innerHTML=html;
}

/* ---------- Filtros ---------- */
function registrosFiltrados(){
const desde=$("f-desde").value,hasta=$("f-hasta").value,asesor=$("f-asesor").value;
return Object.values(REPORTES).filter(r=>{
if(asesor&&r.asesor!==asesor)return false;
if(desde&&r.fecha<desde)return false;
if(hasta&&r.fecha>hasta)return false;
return true;
}).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:a.asesor.localeCompare(b.asesor));
}
function ajustarFiltrosSiVacio(){
const fechas=Object.values(REPORTES).map(r=>r.fecha).sort();
if(!fechas.length)return;
if(!$("f-desde").value)$("f-desde").value=fechas[0];
if(!$("f-hasta").value)$("f-hasta").value=fechas[fechas.length-1];
}

/* ---------- Cálculo ---------- */
function aplicaEnFecha(k,iso){
const a=ACTIVIDADES[k];if(!a)return false;
const d=diaSemana(iso);
if(a.dias==="DOM")return d===0;
if(a.dias==="LV")return d>=1&&d<=5;
return true;
}
function actividadesDelDia(r){
return Object.keys(ACTIVIDADES).filter(k=>aplicaEnFecha(k,r.fecha));
}
function puntosDia(r,bloque){
let posibles=0,obtenidos=0,na=0;
actividadesDelDia(r).forEach(k=>{
if(bloque&&ACTIVIDADES[k].b!==bloque)return;
if(r.na[k]){na++;return;}
posibles+=ACTIVIDADES[k].p;
if(r.operativa[k]===true)obtenidos+=ACTIVIDADES[k].p;
});
return {posibles,obtenidos,na,pct:posibles?obtenidos/posibles*100:0};
}
function pendientesDia(r){
const out={};
BLOQUES.forEach(b=>out[b.id]=[]);
actividadesDelDia(r).forEach(k=>{
if(r.na[k])return;
if(r.operativa[k]===true)return;
const a=ACTIVIDADES[k];
if(out[a.b])out[a.b].push({k,t:a.t,p:a.p});
});
return out;
}
function cobertura(asesor){
const desde=$("f-desde").value,hasta=$("f-hasta").value;
if(!desde||!hasta)return null;
const ini=fechaDe(desde),fin=fechaDe(hasta),hoy=fechaDe(hoyISO());
if(!ini||!fin)return null;
const tope=fin>hoy?hoy:fin;
const esperados=[],faltantes=[];
let descansos=0;
for(let d=new Date(ini);d<=tope;d.setDate(d.getDate()+1)){
const iso=isoDe(d);
if(esDescanso(iso,asesor)){descansos++;continue;}
esperados.push(iso);
if(!REPORTES[iso+"|"+asesor])faltantes.push(iso);
}
return {esperados:esperados.length,reportados:esperados.length-faltantes.length,faltantes,descansos};
}

function copiarTexto(txt,btn){
const ok=()=>{const o=btn.textContent;btn.textContent="Copiado";setTimeout(()=>btn.textContent=o,1800);};
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(txt).then(ok).catch(()=>fallback());
}else fallback();

const ta=$("clip-helper");ta.value=txt;ta.select();
try{document.execCommand("copy");ok();}catch(e){alert(txt);}
}
}

/* ---------- Gráfica de barras por día ---------- */
function graficaPorDia(regs,asesores){
const fechas=Array.from(new Set(regs.map(r=>r.fecha))).sort().slice(-14);
if(!fechas.length)return "";
const barW=asesores.length>1?15:26,gap=4,padGrupo=16;
const grupoW=asesores.length*(barW+gap)+padGrupo;
const izq=32,arriba=12,alto=132,abajo=34;
const W=izq+fechas.length*grupoW+10,H=arriba+alto+abajo;
let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">`;
[0,25,50,75,100].forEach(v=>{
const y=arriba+alto-(v/100*alto);
svg+=`<line x1="${izq}" y1="${y}" x2="${W-6}" y2="${y}" stroke="${v===0?"#cbd5e1":"#eef2f7"}" stroke-width="1"/>`;
svg+=`<text x="${izq-6}" y="${y+3.5}" font-size="9" fill="#9ca3af" text-anchor="end">${v}</text>`;
});
fechas.forEach((f,i)=>{
const x0=izq+i*grupoW+padGrupo/2;
asesores.forEach((a,j)=>{
const r=REPORTES[f+"|"+a];
const x=x0+j*(barW+gap);
if(!r){
svg+=`<rect x="${x}" y="${arriba+alto-4}" width="${barW}" height="4" fill="#fca5a5" rx="1"/>`;
return;
}
const p=puntosDia(r);
const h=Math.max(2,p.pct/100*alto);
svg+=`<rect x="${x}" y="${arriba+alto-h}" width="${barW}" height="${h}" fill="${COLOR_ASESOR[a]||"#0284c7"}" rx="2"><title>${nombreAsesor(a)} · ${fechaCorta(f)} · ${Math.round(p.pct)}%</title></rect>`;
if(barW>=15)svg+=`<text x="${x+barW/2}" y="${arriba+alto-h-3}" font-size="8.5" fill="#6b7280" text-anchor="middle">${Math.round(p.pct)}</text>`;
});
const cx=x0+(asesores.length*(barW+gap)-gap)/2;
svg+=`<text x="${cx}" y="${arriba+alto+14}" font-size="9" fill="#6b7280" text-anchor="middle">${DIAS[diaSemana(f)]}</text>`;
svg+=`<text x="${cx}" y="${arriba+alto+25}" font-size="9" fill="#9ca3af" text-anchor="middle">${f.slice(8)}/${f.slice(5,7)}</text>`;
});
svg+=`</svg>`;
return svg;
}

.concat(nums).concat(["prospectos","pendientes"])];
regs.slice().sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.asesor.localeCompare(b.asesor)).forEach(r=>{
const p=puntosDia(r),p1=puntosDia(r,"parte1"),p2=puntosDia(r,"parte2");
const pend=pendientesDia(r);
const listaPend=BLOQUES.reduce((a,b)=>a.concat(pend[b.id].map(x=>x.t)),[]);
filas.push([r.fecha,DIAS[diaSemana(r.fecha)],r.asesor,Math.round(p.pct),Math.round(p1.pct),Math.round(p2.pct),p.obtenidos,p.posibles,p.na]
.concat(nums.map(k=>r.numeros[k]||0))
.concat([(PROSPECTOS[r.fecha+"|"+r.asesor]||[]).length,listaPend.join(" · ")]));
});
filas.push([]);filas.push(["PROSPECTOS"]);
filas.push(["fecha","asesor","nombre","telefono","modelo","forma_pago","dias_desde_captura"]);
const desde=$("f-desde").value,hasta=$("f-hasta").value,fAsesor=$("f-asesor").value;
Object.keys(PROSPECTOS).sort().forEach(k=>{
const [fecha,asesor]=k.split("|");
if(fAsesor&&asesor!==fAsesor)return;
if(desde&&fecha<desde)return;
if(hasta&&fecha>hasta)return;
PROSPECTOS[k].forEach(p=>filas.push([fecha,asesor,p.nombre,p.tel,p.modelo,p.forma,diasEntre(fecha)]));
});
const csv=filas.map(f=>f.map(celda).join(",")).join("\r\n");
const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download=`consolidado-chalco-${hoyISO()}.csv`;
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------- Eventos ---------- */
$("btn-cargar").onclick=()=>{$("input-csv").value="";$("input-csv").click();};
$("dropzone").onclick=()=>{$("input-csv").value="";$("input-csv").click();};
$("input-csv").onchange=e=>procesarArchivos(e.target.files);
["dragenter","dragover"].forEach(ev=>$("dropzone").addEventListener(ev,e=>{e.preventDefault();$("dropzone").classList.add("activo");}));
["dragleave","drop"].forEach(ev=>$("dropzone").addEventListener(ev,e=>{e.preventDefault();$("dropzone").classList.remove("activo");}));
$("dropzone").addEventListener("drop",e=>{if(e.dataTransfer&&e.dataTransfer.files)procesarArchivos(e.dataTransfer.files);});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>e.preventDefault());
["f-desde","f-hasta","f-asesor"].forEach(id=>$(id).addEventListener("change",render));
$("btn-hoy").onclick=()=>{$("f-desde").value=hoyISO();$("f-hasta").value=hoyISO();render();};
$("btn-mes").onclick=()=>{
const d=new Date(),p=n=>String(n).padStart(2,"0");
$("f-desde").value=`${d.getFullYear()}-${p(d.getMonth()+1)}-01`;
$("f-hasta").value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(new Date(d.getFullYear(),d.getMonth()+1,0).getDate())}`;
render();
};
$("btn-toggle-desc").onclick=()=>{
const panel=$("panel-descansos");
const oculto=panel.classList.toggle("oculto");
$("btn-toggle-desc").textContent=oculto?"Mostrar":"Ocultar";
};
$("panel-descansos").addEventListener("click",e=>{
const dia=e.target.closest(".dia-btn");
if(dia){
const a=dia.dataset.asesor,d=+dia.dataset.dia;
const arr=DESCANSOS.fijos[a];
const i=arr.indexOf(d);
if(i>=0)arr.splice(i,1);else arr.push(d);
guardarStore();pintarDescansos();render();return;
}
const add=e.target.closest(".desc-add");
if(add){
const a=add.dataset.asesor;
const inp=$("panel-descansos").querySelector(`.desc-fecha-input[data-asesor="${a}"]`);
if(!inp.value){alert("Elige una fecha primero.");return;}
if(!DESCANSOS.fechas.some(f=>f.fecha===inp.value&&f.asesor===a))DESCANSOS.fechas.push({fecha:inp.value,asesor:a});
guardarStore();pintarDescansos();render();return;
}
const quitar=e.target.closest("[data-quitar]");
if(quitar){
DESCANSOS.fechas=DESCANSOS.fechas.filter(f=>!(f.fecha===quitar.dataset.quitar&&f.asesor===quitar.dataset.asesor));
guardarStore();pintarDescansos();render();
}
});
$("btn-exportar").onclick=exportar;
$("btn-borrar").onclick=()=>{
if(!confirm("¿Borrar todos los reportes y prospectos cargados? Los días de descanso se conservan. Exporta el consolidado antes si lo necesitas."))return;
REPORTES={};PROSPECTOS={};guardarStore();
$("estado-carga").textContent="";
$("f-desde").value="";$("f-hasta").value="";
render();
};

/* ---------- Arranque ---------- */
cargarStore();
pintarDescansos();
ajustarFiltrosSiVacio();
render();
</script>
</body></html>
