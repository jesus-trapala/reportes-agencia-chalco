/* Modo claro/oscuro antes de pintar (diseño-vento.md). Clave compartida con el
   Portal Vento ("vento-tema"); se lee también la anterior ("temaVento"). */
(function(){
  var t=null;
  try{t=localStorage.getItem("vento-tema")||localStorage.getItem("temaVento");}catch(e){}
  if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t;
})();
</script>

<style id="vento-base">
/* =====================  TOKENS (diseño-vento.md)  ===================== */
:root{
  --bg:#f7f3ec; --card:#ffffff; --text:#16181d; --muted:#6b6f78; --border:#e6e0d6;
  --accent:#2B6EF2; --on-accent:#ffffff; --alerta:#e63329;
  --ok:#1e9e57; --warn:#d18a00; --alert:#d9661f; --bad:#e63329;
  --m-hoy:#2f7cf6; --m-asesores:#14a08f; --m-racha:#e2a21a; --m-vc:#7b5cf0;
  --m-entregas:#e07a2e; --m-resenas:#2fa04a; --m-expedientes:#e04e93; --m-pilot:#3d5f93;
  --m-meta:linear-gradient(135deg,#2B6EF2,#1846b8);
  --ink-racha:#2a1d00;
  --logo:#e63329;
  --suave:#f3eee5;
  --sombra-mos:0 8px 18px -10px rgba(22,24,29,.45);
  --f-titulo:"Oswald",Impact,"Arial Narrow",sans-serif;
  --f-texto:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#0d0f14; --card:#141821; --text:#f2f4f8; --muted:#8d95a6; --border:#232733;
  --ok:#3ecf7a; --warn:#f0b429; --alert:#f08a4b; --bad:#ff5a4f;
  --m-hoy:#1f55d6; --m-asesores:#0e7468; --m-racha:#9a5d0a; --m-vc:#5137b8;
  --m-entregas:#a4521a; --m-resenas:#2a6f2e; --m-expedientes:#8f2b63; --m-pilot:#2e4a72;
  --m-meta:linear-gradient(135deg,#2B6EF2,#163c9e);
  --ink-racha:#ffffff;
  --suave:#1a1f2a;
  --sombra-mos:0 8px 18px -10px rgba(0,0,0,.8);
}
@media screen{
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--f-texto)}
}
/* =====================  ENCABEZADO VENTO  ===================== */

.vh-in{max-width:var(--vh-max,1040px);margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.vh-marca{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;font-family:var(--f-titulo);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh-marca span{color:var(--muted);margin-left:.35em}
.vh-marca:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
@media(max-width:420px){.vh-marca{font-size:15px;letter-spacing:.02em}}
.vh-logo{width:44px;height:44px;border-radius:12px;background:var(--logo);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--sombra-mos);text-decoration:none}
.vh-logo svg{display:block}
.vh-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.vh-ag{font-family:var(--f-titulo);font-weight:600;font-size:11px;letter-spacing:.16em;color:var(--muted);line-height:1.2}

table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}

<script>
/* =========================================================
   Catálogo. Debe coincidir con las claves del checklist.
   bloque: "parte1" o "parte2" · p: peso · na: admite No aplica
   ========================================================= */
const BLOQUES=[
{id:"parte1",titulo:"Primera parte del turno"},
{id:"parte2",titulo:"Segunda parte del turno"}
];
const ACTIVIDADES={
limpieza_agencia:{t:"Limpieza de la agencia",p:1,b:"parte1"},
exhibicion_motos:{t:"Exhibición, acomodo y limpieza de motocicletas",p:1,b:"parte1"},
semaforos_actualizados:{t:"Semáforos actualizados",p:1,b:"parte1"},
kiosko_encendido:{t:"Kiosko digital encendido",p:1,b:"parte1"},
demos_listas:{t:"Unidades demo listas",p:1,b:"parte1"},
acomodo_refaccionaria:{t:"Refaccionaria acomodada y limpia",p:1,b:"parte1"},
redes_sociales:{t:"Gestión de redes sociales y WhatsApp",p:2,b:"parte2"},
cambaceo_realizado:{t:"Se realizó cambaceo",p:2,b:"parte2"},
comida_checada:{t:"Se envió evidencia del horario de comida checado",p:1,b:"parte2"},
hojas_membretadas:{t:"Captura de hojas membretadas al día",p:1,b:"parte2"},
mystery_shopper:{t:"Envío de role play Mystery Shopper",p:2,b:"parte2",dias:"LV"},
expedientes_netsuite:{t:"Expedientes y comprobantes en NetSuite",p:2,b:"parte2",na:true}
};
const NUMEROS={
pilot_subidos:"PILOT",
visitas_bitacora:"Visitas bitácora",
fin_ventocredit:"VentoCredit"
};
const ASESORES=["OSVALDO","KEVIN"];
const COLOR_ASESOR={OSVALDO:"var(--c-osvaldo)",KEVIN:"var(--c-kevin)"};
const STORE_KEY="concentradorChalcoV3";
const STORE_VIEJO="concentradorChalcoV2";
const $=id=>document.getElementById(id);
let REPORTES={},PROSPECTOS={},DESCANSOS={fijos:{OSVALDO:[],KEVIN:[]},fechas:[]};

/* ---------- Utilidades ---------- */
function hoyISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fechaDe(iso){const p=(iso||"").split("-");return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null;}
function isoDe(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
const DIAS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
function diaSemana(iso){const d=fechaDe(iso);return d?d.getDay():0;}
function fechaCorta(iso){const d=fechaDe(iso);return d?`${DIAS[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`:iso;}
function colorPorPct(v){const p=Math.round(v);if(p>=90)return "var(--ok)";if(p>=80)return "var(--warn)";if(p>=70)return "var(--alert)";return "var(--bad)";}
function nombreAsesor(a){return a==="OSVALDO"?"Osvaldo":a==="KEVIN"?"Kevin":a;}
function claseBadge(a){return a==="OSVALDO"?"badge-osvaldo":a==="KEVIN"?"badge-kevin":"";}
function esc(s){return String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function diasEntre(iso){const d=fechaDe(iso),h=fechaDe(hoyISO());return (d&&h)?Math.round((h-d)/86400000):0;}

/* ---------- Parser CSV que respeta comillas ---------- */
function parseCSV(texto){
const t=String(texto).replace(/^﻿/,"");
const filas=[];let campo="",fila=[],dentro=false;
for(let i=0;i<t.length;i++){
const c=t[i];
if(dentro){
if(c==='"'){if(t[i+1]==='"'){campo+='"';i++;}else dentro=false;}
else campo+=c;
}else{
if(c==='"')dentro=true;
else if(c===","){fila.push(campo);campo="";}
else if(c==="\n"){fila.push(campo);filas.push(fila);fila=[];campo="";}
else if(c==="\r"){}
else campo+=c;
}
}
if(campo!==""||fila.length){fila.push(campo);filas.push(fila);}
return filas.filter(f=>f.some(x=>String(x).trim()!==""));
}

/* ---------- Almacenamiento ---------- */
function cargarStore(){
try{
const o=JSON.parse(localStorage.getItem(STORE_KEY));
if(o&&typeof o==="object"){
REPORTES=o.reportes||{};PROSPECTOS=o.prospectos||{};
if(o.descansos)DESCANSOS=o.descansos;
return;
}
}catch(e){}
// Primera vez con el formato nuevo: rescata solo los días de descanso de la versión anterior
try{
const v=JSON.parse(localStorage.getItem(STORE_VIEJO));
if(v&&v.descansos)DESCANSOS=v.descansos;
}catch(e){}
}
function guardarStore(){
try{localStorage.setItem(STORE_KEY,JSON.stringify({reportes:REPORTES,prospectos:PROSPECTOS,descansos:DESCANSOS}));}
catch(e){console.error("No se pudo guardar:",e);}
}

/* ---------- Importación ---------- */
function importarTexto(texto,nombreArchivo){
const filas=parseCSV(texto);
if(!filas.length)return {ok:false,msg:`${nombreArchivo}: archivo vacío`};
const enc=filas[0].map(x=>x.trim().toLowerCase());
const col=n=>enc.indexOf(n);

// Archivo de prospectos suelto (formato anterior). Se sigue aceptando.
if(col("nombre")>=0&&col("telefono")>=0){
const iF=col("fecha"),iA=col("asesor"),iN=col("nombre"),iT=col("telefono"),iM=col("modelo"),iP=col("forma_pago");
if(iF<0||iA<0)return {ok:false,msg:`${nombreArchivo}: al archivo de prospectos le falta fecha o asesor`};
const nuevos={};
filas.slice(1).forEach(f=>{
const fecha=(f[iF]||"").trim(),asesor=(f[iA]||"").trim().toUpperCase();
if(!fecha||!asesor)return;
(nuevos[fecha+"|"+asesor]=nuevos[fecha+"|"+asesor]||[]).push({
nombre:(f[iN]||"").trim(),tel:(f[iT]||"").trim(),
modelo:(iM>=0?(f[iM]||""):"").trim(),forma:(iP>=0?(f[iP]||""):"").trim()
});
});
const claves=Object.keys(nuevos);
if(!claves.length)return {ok:false,msg:`${nombreArchivo}: sin prospectos válidos`};
let n=0;claves.forEach(k=>{PROSPECTOS[k]=nuevos[k];n+=nuevos[k].length;});
return {ok:true,msg:`${nombreArchivo}: ${n} prospecto(s) de ${claves.length} día(s)`};
}

// Reporte del checklist. Desde la versión 5 trae también los prospectos.
if(col("tipo")<0||col("fecha")<0||col("asesor")<0||col("clave")<0)
return {ok:false,msg:`${nombreArchivo}: no tiene el formato de reporte del checklist`};
const iT=col("tipo"),iF=col("fecha"),iA=col("asesor"),iC=col("clave"),
i1=col("valor1"),i2=col("valor2"),i3=col("valor3");
const nuevos={},prospNuevos={};
let desconocidas=0;
filas.slice(1).forEach(f=>{
const tipo=(f[iT]||"").trim().toLowerCase(),fecha=(f[iF]||"").trim(),asesor=(f[iA]||"").trim().toUpperCase();
const clave=(f[iC]||"").trim(),
v1=(i1>=0?(f[i1]||""):"").trim(),
v2=(i2>=0?(f[i2]||""):"").trim(),
v3=(i3>=0?(f[i3]||""):"").trim();
if(!fecha||!asesor)return;
const k=fecha+"|"+asesor;
if(tipo==="prospecto"){
(prospNuevos[k]=prospNuevos[k]||[]).push({nombre:clave,tel:v1,modelo:v2,forma:v3});
return;
}
if(!nuevos[k])nuevos[k]={fecha,asesor,tipoDia:"habil",version:"",operativa:{},na:{},numeros:{}};
const r=nuevos[k];
if(tipo==="meta"){
if(clave==="version"){r.version=v1;r.tipoDia=v2||"habil";}
}
else if(tipo==="operativa"){
if(!ACTIVIDADES[clave])desconocidas++;
if(v1==="NA")r.na[clave]=true;
else r.operativa[clave]=v1==="1";
}
else if(tipo==="numero")r.numeros[clave]=parseInt(v1,10)||0;
});
const claves=Object.keys(nuevos);
if(!claves.length)return {ok:false,msg:`${nombreArchivo}: sin filas válidas`};
let reemplazados=0;
claves.forEach(k=>{if(REPORTES[k])reemplazados++;REPORTES[k]=nuevos[k];});
// El reporte manda: si el archivo trae prospectos, sustituyen a los que hubiera de ese día
Object.keys(prospNuevos).forEach(k=>{PROSPECTOS[k]=prospNuevos[k];});
const nProsp=Object.values(prospNuevos).reduce((a,v)=>a+v.length,0);
let msg=`${nombreArchivo}: ${claves.length} día(s)`;
if(nProsp)msg+=` · ${nProsp} prospecto(s)`;
if(reemplazados)msg+=` · ${reemplazados} reemplazado(s)`;
if(desconocidas)msg+=` · ⚠ ${desconocidas} actividad(es) que este concentrador no reconoce, revisa que el checklist esté actualizado`;
return {ok:true,msg};
}

function procesarArchivos(fileList){
const archivos=Array.from(fileList||[]);
if(!archivos.length)return;
let pendientes=archivos.length;const mensajes=[];
archivos.forEach(file=>{
const reader=new FileReader();
reader.onload=e=>{
try{const res=importarTexto(String(e.target.result),file.name);mensajes.push(res.msg);}
catch(err){mensajes.push(`${file.name}: error al leer (${err.message})`);}
if(--pendientes===0)terminarCarga(mensajes);
};
reader.onerror=()=>{mensajes.push(`${file.name}: no se pudo leer`);if(--pendientes===0)terminarCarga(mensajes);};
reader.readAsText(file,"UTF-8");
});
}
function terminarCarga(mensajes){
guardarStore();
$("estado-carga").innerHTML=mensajes.map(m=>`<div>${esc(m)}</div>`).join("");
ajustarFiltrosSiVacio();
render();
}

function esDescanso(iso,asesor){
if((DESCANSOS.fijos[asesor]||[]).indexOf(diaSemana(iso))>=0)return true;
return DESCANSOS.fechas.some(f=>f.fecha===iso&&f.asesor===asesor);
}

/* ---------- Filtros ---------- */
function registrosFiltrados(){
const desde=$("f-desde").value,hasta=$("f-hasta").value,asesor=$("f-asesor").value;
return Object.values(REPORTES).filter(r=>{
if(asesor&&r.asesor!==asesor)return false;
if(desde&&r.fecha<desde)return false;
if(hasta&&r.fecha>hasta)return false;
return true;
}).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:a.asesor.localeCompare(b.asesor));
}
function ajustarFiltrosSiVacio(){
const fechas=Object.values(REPORTES).map(r=>r.fecha).sort();
if(!fechas.length)return;
if(!$("f-desde").value)$("f-desde").value=fechas[0];
if(!$("f-hasta").value)$("f-hasta").value=fechas[fechas.length-1];
}

/* ---------- Cálculo ---------- */
function aplicaEnFecha(k,iso){
const a=ACTIVIDADES[k];if(!a)return false;
const d=diaSemana(iso);
if(a.dias==="DOM")return d===0;
if(a.dias==="LV")return d>=1&&d<=5;
return true;
}
function actividadesDelDia(r){
return Object.keys(ACTIVIDADES).filter(k=>aplicaEnFecha(k,r.fecha));
}
function puntosDia(r,bloque){
let posibles=0,obtenidos=0,na=0;
actividadesDelDia(r).forEach(k=>{
if(bloque&&ACTIVIDADES[k].b!==bloque)return;
if(r.na[k]){na++;return;}
posibles+=ACTIVIDADES[k].p;
if(r.operativa[k]===true)obtenidos+=ACTIVIDADES[k].p;
});
return {posibles,obtenidos,na,pct:posibles?obtenidos/posibles*100:0};
}
function pendientesDia(r){
const out={};
BLOQUES.forEach(b=>out[b.id]=[]);
actividadesDelDia(r).forEach(k=>{
if(r.na[k])return;
if(r.operativa[k]===true)return;
const a=ACTIVIDADES[k];
if(out[a.b])out[a.b].push({k,t:a.t,p:a.p});
});
return out;
}
function cobertura(asesor){
const desde=$("f-desde").value,hasta=$("f-hasta").value;
if(!desde||!hasta)return null;
const ini=fechaDe(desde),fin=fechaDe(hasta),hoy=fechaDe(hoyISO());
if(!ini||!fin)return null;
const tope=fin>hoy?hoy:fin;
const esperados=[],faltantes=[];
let descansos=0;
for(let d=new Date(ini);d<=tope;d.setDate(d.getDate()+1)){
const iso=isoDe(d);
if(esDescanso(iso,asesor)){descansos++;continue;}
esperados.push(iso);
if(!REPORTES[iso+"|"+asesor])faltantes.push(iso);
}
return {esperados:esperados.length,reportados:esperados.length-faltantes.length,faltantes,descansos};
}

/* ---------- Mensaje para WhatsApp ---------- */
function mensajePendientes(r){
const p=puntosDia(r);
const pend=pendientesDia(r);
let txt=`*${nombreAsesor(r.asesor)}* · ${fechaCorta(r.fecha)} · Cumplimiento ${Math.round(p.pct)}%\n`;
let hay=false;
BLOQUES.forEach(b=>{
if(!pend[b.id].length)return;
hay=true;
txt+=`\n_${b.titulo}_\n`+pend[b.id].map(x=>`• ${x.t}${x.p===2?" (crítica)":""}`).join("\n")+"\n";
});
txt=hay?txt.replace("Cumplimiento","Pendientes para el cierre. Cumplimiento"):txt+"\nSin pendientes. Bien hecho.\n";
return txt;
}
function copiarTexto(txt,btn){
const ok=()=>{const o=btn.textContent;btn.textContent="Copiado";setTimeout(()=>btn.textContent=o,1800);};
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(txt).then(ok).catch(()=>fallback());
}else fallback();
function fallback(){
const ta=$("clip-helper");ta.value=txt;ta.select();
try{document.execCommand("copy");ok();}catch(e){alert(txt);}
}
}

/* ---------- Gráfica de barras por día ---------- */
function graficaPorDia(regs,asesores){
const fechas=Array.from(new Set(regs.map(r=>r.fecha))).sort().slice(-14);
if(!fechas.length)return "";
const barW=asesores.length>1?15:26,gap=4,padGrupo=16;
const grupoW=asesores.length*(barW+gap)+padGrupo;
const izq=32,arriba=12,alto=132,abajo=34;
const W=izq+fechas.length*grupoW+10,H=arriba+alto+abajo;
let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,Consolas,monospace">`;
[0,25,50,75,100].forEach(v=>{
const y=arriba+alto-(v/100*alto);
svg+=`<line x1="${izq}" y1="${y}" x2="${W-6}" y2="${y}" style="stroke:var(--border)" stroke-width="${v===0?1.5:1}"/>`;
svg+=`<text x="${izq-6}" y="${y+3.5}" font-size="9" style="fill:var(--muted)" text-anchor="end">${v}</text>`;
});
fechas.forEach((f,i)=>{
const x0=izq+i*grupoW+padGrupo/2;
asesores.forEach((a,j)=>{
const r=REPORTES[f+"|"+a];
const x=x0+j*(barW+gap);
if(!r){
svg+=`<rect x="${x}" y="${arriba+alto-4}" width="${barW}" height="4" style="fill:var(--bad)" opacity=".55" rx="1"/>`;
return;
}
const p=puntosDia(r);
const h=Math.max(2,p.pct/100*alto);
svg+=`<rect x="${x}" y="${arriba+alto-h}" width="${barW}" height="${h}" style="fill:${COLOR_ASESOR[a]||"var(--accent)"}" rx="2"><title>${nombreAsesor(a)} · ${fechaCorta(f)} · ${Math.round(p.pct)}%</title></rect>`;
if(barW>=15)svg+=`<text x="${x+barW/2}" y="${arriba+alto-h-3}" font-size="8.5" style="fill:var(--muted)" text-anchor="middle">${Math.round(p.pct)}</text>`;
});
const cx=x0+(asesores.length*(barW+gap)-gap)/2;
svg+=`<text x="${cx}" y="${arriba+alto+14}" font-size="9" style="fill:var(--text)" text-anchor="middle">${DIAS[diaSemana(f)]}</text>`;
svg+=`<text x="${cx}" y="${arriba+alto+25}" font-size="9" style="fill:var(--muted)" text-anchor="middle">${f.slice(8)}/${f.slice(5,7)}</text>`;
});
svg+=`</svg>`;
return svg;
}

BLOQUES.forEach(b=>{
let s=0,c=0;
rs.forEach(r=>{const pb=puntosDia(r,b.id);if(pb.posibles){s+=pb.pct;c++;}});
const pb=c?s/c:0;
html+=`<div class="det" style="margin-top:4px">${b.titulo}: <strong style="color:${colorPorPct(pb)}">${Math.round(pb)}%</strong></div>`;
});
if(cob){
const cpct=cob.esperados?cob.reportados/cob.esperados*100:100;
html+=`<div class="det" style="margin-top:6px">
Cobertura: <strong style="color:${colorPorPct(cpct)}">${cob.reportados} de ${cob.esperados} días</strong>
${cob.descansos?` · ${cob.descansos} de descanso`:""}
${cob.faltantes.length?`<br><span class="alerta">Faltan: ${cob.faltantes.map(fechaCorta).join(" · ")}</span>`:`<br><span class="ok">Sin días faltantes</span>`}
</div>`;
}
html+=`</div>`;
});
html+=`</div></div>`;

/* --- 4. Dónde se está fallando --- */
const fallas=[];
Object.keys(ACTIVIDADES).forEach(k=>{
let aplic=0,fallo=0,na=0;const porQuien={};
regs.forEach(r=>{
if(!aplicaEnFecha(k,r.fecha))return;
if(r.na[k]){na++;return;}
aplic++;
if(r.operativa[k]!==true){fallo++;porQuien[r.asesor]=(porQuien[r.asesor]||0)+1;}
});
if(aplic||na)fallas.push({k,aplic,fallo,na,pct:aplic?fallo/aplic*100:0,porQuien});
});
const conFalla=fallas.filter(f=>f.fallo>0).sort((a,b)=>b.pct-a.pct||b.fallo-a.fallo);
html+=`<div class="card"><div class="card-title">Dónde se está fallando</div>
<div class="card-tag">Ordenado por porcentaje de incumplimiento · ×2 son las críticas</div>`;
if(!conFalla.length){
html+=`<div class="small ok">Todas las actividades se cumplieron en el periodo seleccionado.</div>`;
}else{
html+=`<div class="table-scroll"><table><thead><tr>
<th>Actividad</th><th class="text-center">Parte</th><th class="text-center">Peso</th><th class="text-center">Días</th>
<th class="text-center">Falló</th><th class="text-right">% falla</th><th>Quién</th></tr></thead><tbody>`;
conFalla.forEach(f=>{
const quien=Object.keys(f.porQuien).map(a=>`${nombreAsesor(a)} (${f.porQuien[a]})`).join(", ");
const cls=f.pct>=50?"alerta":f.pct>=25?"tibio":"";
html+=`<tr>
<td>${esc(ACTIVIDADES[f.k].t)}</td>
<td class="text-center gris">${ACTIVIDADES[f.k].b==="parte1"?"1ª":"2ª"}</td>
<td class="text-center">${ACTIVIDADES[f.k].p===2?'<span style="color:var(--accent);font-weight:bold">×2</span>':"×1"}</td>
<td class="text-center">${f.aplic}</td>
<td class="text-center">${f.fallo}</td>
<td class="text-right ${cls}" style="font-weight:bold">${f.pct.toFixed(0)}%</td>
<td class="gris" style="font-size:12px">${esc(quien)}</td>
</tr>`;
});
html+=`</tbody></table></div>`;
}
const conNA=fallas.filter(f=>f.na>0);
if(conNA.length){
html+=`<div class="small">Marcadas como <span class="tibio">No aplica</span>: `+
conNA.map(f=>`${ACTIVIDADES[f.k].t} (${f.na})`).join(" · ")+`</div>`;
}
html+=`</div>`;

/* --- 5. Día por día --- */
const filasDia=regs.map(r=>({tipo:"reporte",r}));
asesores.forEach(a=>{
const cob=cobertura(a);
if(cob)cob.faltantes.forEach(f=>filasDia.push({tipo:"falta",fecha:f,asesor:a}));
});
filasDia.sort((x,y)=>{
const fx=x.tipo==="reporte"?x.r.fecha:x.fecha,fy=y.tipo==="reporte"?y.r.fecha:y.fecha;
if(fx!==fy)return fx<fy?1:-1;
const ax=x.tipo==="reporte"?x.r.asesor:x.asesor,ay=y.tipo==="reporte"?y.r.asesor:y.asesor;
return ax.localeCompare(ay);
});
html+=`<div class="card"><div class="card-title">Día por día</div>
<div class="card-tag">Del más reciente al más antiguo · en rojo los días sin reporte</div>
<div class="table-scroll"><table><thead><tr>
<th>Fecha</th><th>Asesor</th><th class="text-right">Cumpl.</th>
<th class="text-center">1ª parte</th><th class="text-center">2ª parte</th>
<th class="text-center">PILOT</th><th class="text-center">Bitácora</th><th class="text-center">VentoCredit</th><th class="text-center">Prosp.</th>
</tr></thead><tbody>`;
filasDia.forEach(item=>{
if(item.tipo==="falta"){
html+=`<tr class="fila-falta">
<td class="nowrap">${fechaCorta(item.fecha)}</td>
<td><span class="badge ${claseBadge(item.asesor)}">${esc(nombreAsesor(item.asesor))}</span></td>
<td class="text-right alerta" colspan="7">Sin reporte</td></tr>`;
return;
}
const r=item.r,p=puntosDia(r),p1=puntosDia(r,"parte1"),p2=puntosDia(r,"parte2");
const prosp=(PROSPECTOS[r.fecha+"|"+r.asesor]||[]).length;
html+=`<tr>
<td class="nowrap">${fechaCorta(r.fecha)}</td>
<td><span class="badge ${claseBadge(r.asesor)}">${esc(nombreAsesor(r.asesor))}</span></td>
<td class="text-right" style="color:${colorPorPct(p.pct)};font-weight:bold">${Math.round(p.pct)}%${p.na?`<span class="tibio" style="font-size:10px"> ${p.na}na</span>`:""}</td>
<td class="text-center" style="color:${colorPorPct(p1.pct)}">${Math.round(p1.pct)}%</td>
<td class="text-center" style="color:${colorPorPct(p2.pct)}">${Math.round(p2.pct)}%</td>
<td class="text-center">${r.numeros.pilot_subidos||0}</td>
<td class="text-center">${r.numeros.visitas_bitacora||0}</td>
<td class="text-center" style="font-weight:bold;color:${(r.numeros.fin_ventocredit||0)>0?"var(--accent)":"var(--muted)"}">${r.numeros.fin_ventocredit||0}</td>
<td class="text-center">${prosp||"—"}</td>
</tr>`;
});
html+=`</tbody></table></div></div>`;

/* --- 6. Prospectos --- */
const desde=$("f-desde").value,hasta=$("f-hasta").value,fAsesor=$("f-asesor").value;
const lista=[];
Object.keys(PROSPECTOS).forEach(k=>{
const [fecha,asesor]=k.split("|");
if(fAsesor&&asesor!==fAsesor)return;
if(desde&&fecha<desde)return;
if(hasta&&fecha>hasta)return;
PROSPECTOS[k].forEach(p=>lista.push(Object.assign({fecha,asesor,dias:diasEntre(fecha)},p)));
});
lista.sort((a,b)=>b.dias-a.dias);
html+=`<div class="card"><div class="card-title">Prospectos capturados</div>
<div class="card-tag">${lista.length} en el periodo · ordenados por antigüedad</div>`;
if(!lista.length){
html+=`<div class="small">No hay prospectos en el rango.</div>`;
}else{
const viejos=lista.filter(p=>p.dias>=7).length;
if(viejos)html+=`<div class="small alerta">${viejos} prospecto(s) con 7 días o más desde su captura.</div>`;
const modelos={};lista.forEach(p=>{if(p.modelo)modelos[p.modelo]=(modelos[p.modelo]||0)+1;});
const topModelos=Object.entries(modelos).sort((a,b)=>b[1]-a[1]).slice(0,6);
if(topModelos.length)html+=`<div class="small">Más solicitados: `+topModelos.map(m=>`<span class="pill">${esc(m[0])} · ${m[1]}</span>`).join("")+`</div>`;
html+=`<div class="table-scroll"><table><thead><tr>
<th>Nombre</th><th>Teléfono</th><th>Modelo</th><th>Forma de pago</th><th>Asesor</th><th class="nowrap">Capturado</th><th class="text-right">Antigüedad</th>
</tr></thead><tbody>`;
lista.forEach(p=>{
const cls=p.dias>=7?"alerta":p.dias>=3?"tibio":"";
html+=`<tr>
<td>${esc(p.nombre||"(sin nombre)")}</td>
<td class="nowrap">${esc(p.tel||"—")}</td>
<td>${esc(p.modelo||"—")}</td>
<td class="gris">${esc(p.forma||"—")}</td>
<td><span class="badge ${claseBadge(p.asesor)}">${esc(nombreAsesor(p.asesor))}</span></td>
<td class="nowrap">${fechaCorta(p.fecha)}</td>
<td class="text-right nowrap ${cls}">${p.dias===0?"hoy":p.dias===1?"1 día":p.dias+" días"}</td>
</tr>`;
});
html+=`</tbody></table></div>`;
}
html+=`</div>`;

$("contenido").innerHTML=html;

// Botones de copiar
$("contenido").querySelectorAll("[data-copiar]").forEach(b=>{
b.onclick=()=>{const r=REPORTES[b.dataset.copiar];if(r)copiarTexto(mensajePendientes(r),b);};
});
const btnTodo=$("btn-copiar-todo");
if(btnTodo)btnTodo.onclick=()=>copiarTexto(delDia.map(mensajePendientes).join("\n———\n"),btnTodo);
}

/* ---------- Exportar ---------- */
function celda(v){const s=String(v==null?"":v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportar(){
const regs=registrosFiltrados();
if(!regs.length){alert("No hay datos en el rango seleccionado.");return;}
const nums=Object.keys(NUMEROS);
const filas=[["fecha","dia","asesor","pct_cumplimiento","pct_parte1","pct_parte2","puntos_obtenidos","puntos_posibles","no_aplica"]
.concat(nums).concat(["prospectos","pendientes"])];
regs.slice().sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.asesor.localeCompare(b.asesor)).forEach(r=>{
const p=puntosDia(r),p1=puntosDia(r,"parte1"),p2=puntosDia(r,"parte2");
const pend=pendientesDia(r);
const listaPend=BLOQUES.reduce((a,b)=>a.concat(pend[b.id].map(x=>x.t)),[]);
filas.push([r.fecha,DIAS[diaSemana(r.fecha)],r.asesor,Math.round(p.pct),Math.round(p1.pct),Math.round(p2.pct),p.obtenidos,p.posibles,p.na]
.concat(nums.map(k=>r.numeros[k]||0))
.concat([(PROSPECTOS[r.fecha+"|"+r.asesor]||[]).length,listaPend.join(" · ")]));
});
filas.push([]);filas.push(["PROSPECTOS"]);
filas.push(["fecha","asesor","nombre","telefono","modelo","forma_pago","dias_desde_captura"]);
const desde=$("f-desde").value,hasta=$("f-hasta").value,fAsesor=$("f-asesor").value;
Object.keys(PROSPECTOS).sort().forEach(k=>{
const [fecha,asesor]=k.split("|");
if(fAsesor&&asesor!==fAsesor)return;
if(desde&&fecha<desde)return;
if(hasta&&fecha>hasta)return;
PROSPECTOS[k].forEach(p=>filas.push([fecha,asesor,p.nombre,p.tel,p.modelo,p.forma,diasEntre(fecha)]));
});
const csv=filas.map(f=>f.map(celda).join(",")).join("\r\n");
const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download=`consolidado-chalco-${hoyISO()}.csv`;
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------- Eventos ---------- */
$("btn-cargar").onclick=()=>{$("input-csv").value="";$("input-csv").click();};
$("dropzone").onclick=()=>{$("input-csv").value="";$("input-csv").click();};
$("input-csv").onchange=e=>procesarArchivos(e.target.files);
["dragenter","dragover"].forEach(ev=>$("dropzone").addEventListener(ev,e=>{e.preventDefault();$("dropzone").classList.add("activo");}));
["dragleave","drop"].forEach(ev=>$("dropzone").addEventListener(ev,e=>{e.preventDefault();$("dropzone").classList.remove("activo");}));
$("dropzone").addEventListener("drop",e=>{if(e.dataTransfer&&e.dataTransfer.files)procesarArchivos(e.dataTransfer.files);});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>e.preventDefault());
["f-desde","f-hasta","f-asesor"].forEach(id=>$(id).addEventListener("change",render));
$("btn-hoy").onclick=()=>{$("f-desde").value=hoyISO();$("f-hasta").value=hoyISO();render();};
$("btn-mes").onclick=()=>{
const d=new Date(),p=n=>String(n).padStart(2,"0");
$("f-desde").value=`${d.getFullYear()}-${p(d.getMonth()+1)}-01`;
$("f-hasta").value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(new Date(d.getFullYear(),d.getMonth()+1,0).getDate())}`;
render();
};
$("btn-toggle-desc").onclick=()=>{
const panel=$("panel-descansos");
const oculto=panel.classList.toggle("oculto");
$("btn-toggle-desc").textContent=oculto?"Mostrar":"Ocultar";
};
$("panel-descansos").addEventListener("click",e=>{
const dia=e.target.closest(".dia-btn");
if(dia){
const a=dia.dataset.asesor,d=+dia.dataset.dia;
const arr=DESCANSOS.fijos[a];
const i=arr.indexOf(d);
if(i>=0)arr.splice(i,1);else arr.push(d);
guardarStore();pintarDescansos();render();return;
}
const add=e.target.closest(".desc-add");
if(add){
const a=add.dataset.asesor;
const inp=$("panel-descansos").querySelector(`.desc-fecha-input[data-asesor="${a}"]`);
if(!inp.value){alert("Elige una fecha primero.");return;}
if(!DESCANSOS.fechas.some(f=>f.fecha===inp.value&&f.asesor===a))DESCANSOS.fechas.push({fecha:inp.value,asesor:a});
guardarStore();pintarDescansos();render();return;
}
const quitar=e.target.closest("[data-quitar]");
if(quitar){
DESCANSOS.fechas=DESCANSOS.fechas.filter(f=>!(f.fecha===quitar.dataset.quitar&&f.asesor===quitar.dataset.asesor));
guardarStore();pintarDescansos();render();
}
});
$("btn-exportar").onclick=exportar;
$("btn-borrar").onclick=()=>{
if(!confirm("¿Borrar todos los reportes y prospectos cargados? Los días de descanso se conservan. Exporta el consolidado antes si lo necesitas."))return;
REPORTES={};PROSPECTOS={};guardarStore();
$("estado-carga").textContent="";
$("f-desde").value="";$("f-hasta").value="";
render();
};

/* ---------- Arranque ---------- */
cargarStore();
pintarDescansos();
ajustarFiltrosSiVacio();
render();
</script>
<script>
/* Modo claro/oscuro (botón luna/sol) e instalación como app. Solo diseño. */
(function(){
  var raiz=document.documentElement, meta=document.querySelector('meta[name="theme-color"]');
  function pintar(){ if(meta) meta.content = raiz.dataset.theme==="dark" ? "#0d0f14" : "#f7f3ec"; }
  pintar();
  var b=document.getElementById("btn-tema");
  if(b) b.addEventListener("click",function(){
    var nuevo = raiz.dataset.theme==="dark" ? "light" : "dark";
    raiz.dataset.theme = nuevo;
    try{ localStorage.setItem("vento-tema",nuevo); localStorage.setItem("temaVento",nuevo); }catch(e){}
    pintar();
    window.dispatchEvent(new CustomEvent("vento-tema",{detail:nuevo}));
  });
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
